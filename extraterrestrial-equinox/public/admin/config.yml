backend:
  name: github
  repo: Tacocat991763/artist-portfolio-
  branch: main

media_folder: public/artwork
public_folder: /artwork

collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: gallery
        label: Gallery
        file: src/data/artworks.json
        fields:
          - name: artworks
            label: Artworks
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: title
                label: Title
                widget: string
              - name: image
                label: Image
                widget: image
